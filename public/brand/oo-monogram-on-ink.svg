<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 60" width="88" height="60" role="img" aria-label="Outgrow Okay monogram">
  <title>Outgrow Okay — OO Monogram</title>
  <rect width="88" height="60" fill="#16130F"/>
  
  <!-- OO Monogram: interlocking double-O implying continuity / infinity -->
  <!-- Left O — smaller -->
  <ellipse cx="28" cy="30" rx="17.5" ry="22" 
           fill="none" stroke="#F3ECE0" stroke-width="5.5" 
           stroke-linecap="round"/>
  <!-- Right O — larger, overlapping at bridge -->
  <ellipse cx="59" cy="30" rx="22" ry="27" 
           fill="none" stroke="#F3ECE0" stroke-width="5.5"
           stroke-linecap="round"/>
  <!-- Bridge mask: white rectangle to cut the inner shared strokes,
       leaving only the outer continuous form visible -->
  <rect x="37" y="3" width="10" height="54" fill="#F3ECE0"/>

</svg>