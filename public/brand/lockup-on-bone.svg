<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 60" width="440" height="60" role="img" aria-label="Outgrow Okay logo">
  <title>Outgrow Okay</title>
  <rect width="440" height="60" fill="#F3ECE0"/>
  <!-- OO Monogram -->
  <ellipse cx="28" cy="30" rx="17.5" ry="22" 
           fill="none" stroke="#16130F" stroke-width="5.5"/>
  <ellipse cx="59" cy="30" rx="22" ry="27" 
           fill="none" stroke="#16130F" stroke-width="5.5"/>
  <rect x="37" y="3" width="10" height="54" fill="#16130F" 
        style="fill:#F3ECE0"/>
  <!-- Divider -->
  <line x1="96" y1="12" x2="96" y2="48" stroke="#16130F" stroke-width="1" opacity="0.3"/>
  <!-- Wordmark -->
  <text x="108" y="39" 
        font-family="'Archivo', 'Space Grotesk', 'Arial Black', sans-serif"
        font-size="28" 
        font-weight="700"
        letter-spacing="-0.5"
        fill="#16130F">OUTGROW</text>
  <text x="276" y="39"
        font-family="'Archivo', 'Space Grotesk', 'Arial', sans-serif"
        font-size="28"
        font-weight="300"
        letter-spacing="0.5"
        fill="#16130F">OKAY</text>
</svg>